name: Build and Deploy Wsab Science

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare site
        shell: bash
        run: |
          rm -rf site
          mkdir -p site/icons
          cp index.html manifest.json sw.js firebase-rest.js wsab-features.js wsab-roles.js wsab-management.js wsab-student-school.js wsab-classroom-cloud.js site/
          cp icons/icon.svg site/icons/icon.svg
          python - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          for tag in ['<script src="firebase-rest.js"></script>','<script src="wsab-features.js"></script>','<script src="wsab-roles.js"></script>','<script src="wsab-management.js"></script>','<script src="wsab-student-school.js"></script>','<script src="wsab-classroom-cloud.js"></script>']:
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s, encoding='utf-8')
          Path('site/.nojekyll').write_text('', encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  validate:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate PWA
        run: npx --yes @bubblewrap/cli validate --url='${{ needs.deploy.outputs.page_url }}'
