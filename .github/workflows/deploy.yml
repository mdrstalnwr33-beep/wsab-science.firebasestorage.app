name: Build Wsab Science APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: wsab-apk-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare web assets
        shell: bash
        run: |
          rm -rf site app/src/main/assets/site
          mkdir -p site/icons app/src/main/assets/site/icons
          cp index.html manifest.json sw.js firebase-rest.js wsab-features.js wsab-roles.js wsab-management.js wsab-student-school.js wsab-classroom-cloud.js wsab-grading.js wsab-home.js site/
          cp icons/icon.svg site/icons/icon.svg
          cp -R site/. app/src/main/assets/site/
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/site/index.html')
          s=p.read_text(encoding='utf-8')
          tags=['firebase-rest.js','wsab-features.js','wsab-roles.js','wsab-management.js','wsab-student-school.js','wsab-classroom-cloud.js','wsab-grading.js','wsab-home.js']
          for name in tags:
              tag=f'<script src="{name}"></script>'
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for f in firebase-rest.js wsab-features.js wsab-roles.js wsab-management.js wsab-student-school.js wsab-classroom-cloud.js wsab-grading.js wsab-home.js; do node --check "$f"; done

      - name: Verify Android project
        shell: bash
        run: |
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/wsab/educational/science/MainActivity.java
          test -s app/src/main/res/values/styles.xml
          test -s app/src/main/assets/site/index.html
          grep -q 'com.wsab.educational.science' app/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wsab-science-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          echo "Wsab Science APK build completed successfully."
          echo "Run: ${{ github.run_number }}"
          echo "APK: app/build/outputs/apk/debug/app-debug.apk"
