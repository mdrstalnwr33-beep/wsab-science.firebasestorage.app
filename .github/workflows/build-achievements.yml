name: Build Wsab Science APK - Achievements

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wsab-apk-achievements
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare web assets
        shell: bash
        run: |
          rm -rf app/src/main/assets/site
          mkdir -p app/src/main/assets/site/icons
          cp index.html manifest.json sw.js firebase-rest.js wsab-features.js wsab-roles.js wsab-management.js wsab-student-school.js wsab-classroom-cloud.js wsab-grading.js wsab-home.js wsab-agent.js wsab-reference-suite.js wsab-integration.js wsab-achievements.js wsab-internal-view.js app/src/main/assets/site/
          cp icons/icon.svg app/src/main/assets/site/icons/icon.svg
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/site/index.html')
          s=p.read_text(encoding='utf-8')
          for tag in ['<script src="wsab-internal-view.js"></script>','<script src="wsab-achievements.js"></script>']:
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check wsab-achievements.js
          node --check wsab-integration.js
          node --check wsab-internal-view.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wsab-science-achievements-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
